        enabled-file-button="true"

        theme="{}"
        streaming="true"
        layout="standard"
        with-debug="true"
        use-local-storage-cache="true"
        session-id-storage="localstorage"
      ></ts-messenger>
      <!-- Polling variant: set polling-interval in ms (e.g. 3000 = 3 seconds) to
           POST /api/agents/{agent_id}/client-push/subscribe (stream=false)
           instead of the SSE stream. The interval controls how often the
           client polls for new messages. -->
